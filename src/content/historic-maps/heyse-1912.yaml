accuracy_km: { median: 2.5, max: 13.6 }
notes: >-
  Organizado em 1910 e publicado em 1912, na escala 1:1.000.000; mostra linhas em tráfego, em
  construção e projetadas, com as quilometragens das estações (Penápolis K219, Glicério K239,
  Araçatuba K279, Itapura K436, Jupiá K461). Georreferenciamento preliminar feito pelo projeto:
  48 cruzamentos da malha de meridianos e paralelos detectados automaticamente (longitudes
  contadas a oeste do Rio de Janeiro, 43°10'10" W) e corrigidos por 15 pontos identificados no
  mapa e hoje. O mapa é preciso no leste (1–3 km) e impreciso no oeste, então fronteira de
  ocupação (até ~14 km sem correção). Dados em research/georef/heyse-1912/.
