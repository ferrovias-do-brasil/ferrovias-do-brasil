title: Mappa da viação ferrea de São Paulo e partes dos estados vizinhos
year: 1912
author: R. Heyse (Comissão de Prolongamentos e Desenvolvimento da Sorocabana); Weiszflog Irmãos
archive: Princeton University Library (Digital Maps and Geospatial Data)
