# Companhia Paulista de Estradas de Ferro — Linha Tronco (Jundiaí → Rio Claro, 1872–1876)
# e Tronco Oeste até Bauru (antigas linhas da Companhia Rio-Clarense, 1884–1887, e ramais da Paulista até 1910)
#
# Datas de abertura tiradas dos relatórios da Diretoria da Companhia Paulista
# (Arquivo Público do Estado / Memória Ferroviária), conferidas com Giesbrecht.
# Bitola larga (1,60 m). Geometria do OpenStreetMap (cache estadual da malha-sp).

line: cp
name: Companhia Paulista — Jundiaí–Rio Claro–Bauru
bbox: [ -49.15, -23.25, -46.80, -22.10 ]
osm_cache: malha-sp

nodes:
  - id: jundiai-paulista
    name: Jundiaí (estação da Paulista)
    kind: station
    station: jundiai-paulista
    coords: [ -46.878984, -23.185392 ]
    note: Estação própria da Paulista, cerca de 1 km além da estação da São Paulo Railway.
  - id: valinhos
    name: Valinhos
    kind: station
    station: valinhos
    coords: [ -46.994054, -22.967948 ]
  - id: samambaia
    name: Samambaia (estação provisória de 1872)
    kind: station
    coords: [ -47.029746, -22.93108 ]
    note: >-
      Ponto aproximado, no km 37,4, onde Giesbrecht situa a estação de Samambaia aberta em 1893. Em 1872 houve ali uma estação provisória, segundo o relatório da Companhia; o local exato não é conhecido.
  - id: campinas
    name: Campinas
    kind: station
    station: campinas-paulista
    coords: [ -47.066284, -22.908943 ]
  - id: santa-barbara
    name: Santa Bárbara (Americana)
    kind: station
    station: americana
    coords: [ -47.328084, -22.738194 ]
  - id: ponte-piracicaba
    name: Ponte sobre o rio Piracicaba
    kind: bridge
    coords: [ -47.35243, -22.66435 ]
    note: Ponto da ponte entre Santa Bárbara e Tatu (OSM); ponta dos trilhos em junho de 1876.
  - id: limeira
    name: Limeira
    kind: station
    station: limeira
    coords: [ -47.397809, -22.564206 ]
  - id: rio-claro
    name: Rio Claro
    kind: station
    station: rio-claro
    snap: old
    coords: [ -47.55846, -22.407075 ]

  - id: jct-santa-gertrudes
    name: Junção de Santa Gertrudes
    kind: junction
    coords: [ -47.525604, -22.453998 ]
    note: Onde a Variante Santa Gertrudes–Itirapina (1980) deixa a linha de Rio Claro; ponto aproximado.
  - id: itirapina
    name: Itirapina
    kind: station
    station: itirapina
    coords: [ -47.817831, -22.258849 ]
    note: Estação de 1916, na bifurcação das linhas para São Carlos e para Jaú.
  - id: campo-alegre
    name: Campo Alegre
    kind: station
    station: campo-alegre
    coords: [ -47.962362, -22.243445 ]
  - id: brotas
    name: Brotas
    kind: station
    station: brotas
    coords: [ -48.111314, -22.286666 ]
  - id: dois-corregos
    name: Dois Córregos
    kind: station
    station: dois-corregos
    coords: [ -48.378475, -22.37113 ]
  - id: jau
    name: Jaú
    kind: station
    station: jau
    coords: [ -48.556471, -22.305295 ]
  - id: pederneiras
    name: Pederneiras
    kind: station
    station: pederneiras
    coords: [ -48.773939, -22.358203 ]
  - id: bauru-paulista
    name: Bauru (Paulista)
    kind: station
    station: bauru-paulista
    coords: [ -49.073791, -22.318124 ]
    note: Ponto de encontro com a Noroeste e com a Sorocabana.

segments:
  - id: cp-jundiai-valinhos
    name: Jundiaí – Louveira – Vinhedo – Valinhos
    from: jundiai-paulista
    to: valinhos
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600, via: [ [ -46.94905, -23.08519 ], [ -46.97124, -23.02965 ] ] }
    geometry_confidence: high
    geometry_note: &jc-note >-
      Leito original da Paulista, hoje sem tráfego (no OSM, "Antiga Cia Paulista (TIC Jundiaí–Campinas)"); a linha foi duplicada por volta de 1915.
    status_history:
      - status: open
        from: '1872-03-31'
        sources: [ cpef-rel-1872-set ]
        note: Primeira viagem, de Jundiaí a Valinhos, com paradas em Capivary (Louveira) e Cachoeira (Vinhedo).
      - &jc-freight
        status: freight_only
        from: '1978'
        circa: true
        sources: [ giesbrecht-louveira ]
        note: Estações desativadas para passageiros "no final dos anos 1970". Hoje o trecho está sem tráfego segundo o OpenStreetMap; a data em que a carga parou ainda precisa de fonte.

  - id: cp-valinhos-samambaia
    name: Valinhos – Samambaia
    from: valinhos
    to: samambaia
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600 }
    geometry_confidence: high
    geometry_note: *jc-note
    status_history:
      - status: open
        from: '1872-04-05'
        sources: [ cpef-rel-1872-set ]
        note: Trens de passageiros até uma estação provisória em Samambaia.
      - *jc-freight

  - id: cp-samambaia-campinas
    name: Samambaia – Campinas
    from: samambaia
    to: campinas
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600 }
    geometry_confidence: high
    geometry_note: *jc-note
    status_history:
      - status: open
        from:
          - { value: '1872-08-11', source: giesbrecht-campinas-cp, preferred: true, note: Data consagrada da inauguração da estação de Campinas. }
          - { value: '1872-08-09', source: cpef-rel-1872-set, note: 'O relatório registra a autorização "concedida a 9 do mesmo mez, e ali fez-se a inauguração".' }
      - *jc-freight

  - id: cp-campinas-santa-barbara
    name: Campinas – Boa Vista – Rebouças (Sumaré) – Santa Bárbara (Americana)
    from: campinas
    to: santa-barbara
    alignment: original
    geometry:
      method: osm-old
      max_gap_m: 600
      via: [ [ -47.14262, -22.88655 ], [ -47.26421, -22.82125 ], [ -47.29157, -22.77677 ], [ -47.31387, -22.76677 ] ]
    geometry_confidence: high
    status_history:
      - status: open
        from: '1875-08-27'
        sources: [ cpef-rel-1876-fev ]
        note: '"Inauguração da parte concluída da linha, desde Campinas até a estação de Santa Barbara, trinta e oito kilometros de extensão."'
      - &cr-freight
        status: freight_only
        from:
          - { value: '2001-03', source: giesbrecht-americana, preferred: true }
          - { value: '2001-04-16', source: giesbrecht-limeira, note: Último trem de passageiros partindo de Limeira rumo a Campinas. }

  - id: cp-santa-barbara-piracicaba
    name: Santa Bárbara – ponte do rio Piracicaba
    from: santa-barbara
    to: ponte-piracicaba
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600 }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1876-06-19'
        sources: [ cpef-rel-1876-set ]
        note: Trem de passageiros de Santa Bárbara até a ponte, a pedido do público (a ponte da estrada geral sobre o Atibaia tinha caído).
      - *cr-freight

  - id: cp-piracicaba-limeira
    name: Ponte do Piracicaba – Tatu – Limeira
    from: ponte-piracicaba
    to: limeira
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600, via: [ [ -47.35213, -22.65230 ] ] }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1876-06-30'
        sources: [ cpef-rel-1876-set ]
        note: Abertas as estações de Tatu e Limeira.
      - *cr-freight

  - id: cp-limeira-santa-gertrudes
    name: Limeira – Cordeiro – Santa Gertrudes
    from: limeira
    to: jct-santa-gertrudes
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600, via: [ [ -47.45372, -22.48129 ] ] }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1876-08-11'
        sources: [ cpef-rel-1876-set ]
        note: Tráfego provisório até "a cidade de S. João do Rio Claro".
      - *cr-freight

  - id: cp-santa-gertrudes-rio-claro
    name: Santa Gertrudes – Rio Claro
    from: jct-santa-gertrudes
    to: rio-claro
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600 }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1876-08-11'
        sources: [ cpef-rel-1876-set ]
      - *cr-freight

  # ------------------------------------------------------------------
  # Rio Claro → Itirapina: Companhia Rio-Clarense (1884), bitola larga por Batovi (1916), variante (1980)
  # ------------------------------------------------------------------
  - id: cp-rio-claro-itirapina
    name: Rio Claro – Batovi – Itirapina
    from: rio-claro
    to: itirapina
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600, via: [ [ -47.642, -22.370 ], [ -47.722, -22.312 ] ] }
    geometry_confidence: medium
    geometry_note: >-
      Leito da linha de bitola larga de 1916, por Batovi, arrancado depois de 1980 (OSM). A linha métrica original da Rio-Clarense (1884) seguia por Estrela e Feijão (Visconde do Rio Claro) e só coincide em parte; perto de Itirapina o OSM guarda um pedaço dela.
    status_history:
      - status: open
        from:
          - { value: '1884-12-01', source: giesbrecht-visconde-rio-claro-velha, preferred: true, note: 'Linha Rio Claro–São Carlos da Companhia Rio-Clarense, bitola métrica; data "segundo a Companhia Paulista".' }
          - { value: '1884-10-15', source: giesbrecht-visconde-rio-claro-velha, note: Data dada como possível na mesma página. }
        note: Comprada pela Paulista em 1892; refeita em bitola larga, com a nova estação de Itirapina e a de Batovi, em 1/6/1916.
      - status: removed
        from: '1980'
        sources: [ giesbrecht-batovi ]
        note: Batovi está "sem trilhos" desde 1980, quando foi construída a variante Santa Gertrudes–Itirapina.

  - id: cp-variante-santa-gertrudes-itirapina
    name: Variante Santa Gertrudes – Itirapina (1980)
    from: jct-santa-gertrudes
    to: itirapina
    alignment: variant
    replaces: [ cp-rio-claro-itirapina ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1980'
        sources: [ giesbrecht-batovi ]
      - &to-freight
        status: freight_only
        from: '2001-03-15'
        sources: [ giesbrecht-itirapina, giesbrecht-jau ]
        note: Último trem de passageiros, operado pela Ferroban.

  # ------------------------------------------------------------------
  # Itirapina → Jaú: Ramal de Jaú da Companhia Rio-Clarense (1885–1887), Tronco Oeste em 1941
  # ------------------------------------------------------------------
  - id: cp-itirapina-campo-alegre
    name: Itirapina – Campo Alegre
    from: itirapina
    to: campo-alegre
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: medium
    geometry_note: >-
      Traçado atual. Até 1916 o ramal saía de Visconde do Rio Claro (Feijão) e passava pela velha Itirapina (Morro Pelado), cerca de 1 km dali; Campo Alegre "sempre permaneceu no mesmo local".
    status_history:
      - status: open
        from: '1885-07-01'
        sources: [ giesbrecht-campo-alegre, giesbrecht-itirapina-velha ]
        note: Ramal de Jaú da Companhia Rio-Clarense, bitola métrica. Bitola larga a partir de 1941.
      - *to-freight

  - id: cp-campo-alegre-brotas
    name: Campo Alegre – Brotas (aproximado)
    from: campo-alegre
    to: brotas
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: low
    geometry_note: >-
      Desenhado sobre o traçado atual. Em 1929 a linha foi retificada e a estação de Brotas, "a terceira desde 1885", foi construída fora da cidade; o leito antigo ainda não está mapeado.
    status_history:
      - status: open
        from:
          - { value: '1885', source: giesbrecht-brotas, note: Brotas tem estação desde 1885. }
      - *to-freight

  - id: cp-brotas-dois-corregos
    name: Brotas – Dois Córregos (aproximado)
    from: brotas
    to: dois-corregos
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: low
    geometry_note: Desenhado sobre o traçado atual; o ramal métrico original foi retificado entre 1929 e 1941.
    status_history:
      - status: open
        from: '1886-09-07'
        sources: [ giesbrecht-dois-corregos ]
      - *to-freight

  - id: cp-dois-corregos-jau
    name: Dois Córregos – Jaú (aproximado)
    from: dois-corregos
    to: jau
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: low
    geometry_note: >-
      Desenhado sobre o traçado atual. O ramal original passava por Mineiros; em 1941 o Tronco Oeste passou a seguir por Lacerda Franco, com nova estação em Jaú (15/11/1941). O leito antigo ainda não está mapeado.
    status_history:
      - status: open
        from: '1887'
        sources: [ giesbrecht-jau, giesbrecht-dois-corregos ]
        note: Ponta do Ramal de Jaú da Rio-Clarense.
      - *to-freight

  # ------------------------------------------------------------------
  # Jaú → Pederneiras (1903) → Bauru (1910): ramais da Paulista, unidos ao Tronco Oeste em 1941
  # ------------------------------------------------------------------
  - id: cp-jau-pederneiras
    name: Jaú – Pederneiras
    from: jau
    to: pederneiras
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: medium
    geometry_note: Traçado atual; o trecho foi incorporado ao Tronco Oeste em 1941 e pode ter sido retificado.
    status_history:
      - status: open
        from: '1903-10-01'
        sources: [ giesbrecht-pederneiras ]
        note: Pederneiras abre como ponta do ramal de Agudos, em bitola métrica.
      - *to-freight

  - id: cp-pederneiras-bauru
    name: Pederneiras – Bauru (Ramal de Bauru)
    from: pederneiras
    to: bauru-paulista
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: medium
    geometry_note: Traçado atual; bitola larga desde 15/6/1947.
    status_history:
      - status: open
        from: '1910-08-08'
        sources: [ giesbrecht-bauru-cp, giesbrecht-pederneiras ]
        note: A Paulista chega a Bauru e encontra a Noroeste e a Sorocabana.
      - *to-freight
