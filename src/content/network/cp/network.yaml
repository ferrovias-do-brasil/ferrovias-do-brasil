  # ------------------------------------------------------------------
  # Rio Claro → Itirapina: Companhia Rio-Clarense (1884), bitola larga por Batovi (1916), variante (1980)
  # ------------------------------------------------------------------
  - id: cp-rio-claro-itirapina
    name: Rio Claro – Batovi – Itirapina
    from: rio-claro
    to: itirapina
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600, via: [ [ -47.642, -22.370 ], [ -47.722, -22.312 ] ] }
    geometry_confidence: medium
    geometry_note: >-
      Leito da linha de bitola larga de 1916, por Batovi, arrancado depois de 1980 (OSM). A linha métrica original da Rio-Clarense (1884) seguia por Estrela e Feijão (Visconde do Rio Claro) e só coincide em parte; perto de Itirapina o OSM guarda um pedaço dela.
    status_history:
      - status: open
        from:
          - { value: '1884-12-01', source: giesbrecht-visconde-rio-claro-velha, preferred: true, note: 'Linha Rio Claro–São Carlos da Companhia Rio-Clarense, bitola métrica; data "segundo a Companhia Paulista".' }
          - { value: '1884-10-15', source: giesbrecht-visconde-rio-claro-velha, note: Data dada como possível na mesma página. }
        note: 'Comprada pela Paulista em 1/4/1892; refeita em bitola larga em 1/6/1916, "inaugurando-se no mesmo dia as estações de Batovy, Itapé, Gramma, Ityrapina" (relatório de 1917).'
      - status: removed
        from: '1980'
        sources: [ giesbrecht-batovi ]
        note: Batovi está "sem trilhos" desde 1980, quando foi construída a variante Santa Gertrudes–Itirapina.

  - id: cp-variante-santa-gertrudes-itirapina
    name: Variante Santa Gertrudes – Itirapina (1980)
    from: jct-santa-gertrudes
    to: itirapina
    alignment: variant
    replaces: [ cp-rio-claro-itirapina ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1980'
        sources: [ giesbrecht-batovi ]
      - &to-freight
        status: freight_only
        from: '2001-03-15'
        sources: [ giesbrecht-itirapina, giesbrecht-jau ]
        note: Último trem de passageiros, operado pela Ferroban.

  # ------------------------------------------------------------------
  # Itirapina → Jaú: Ramal de Jaú da Companhia Rio-Clarense (1885–1887), Tronco Oeste em 1941
  # ------------------------------------------------------------------
  - id: cp-itirapina-campo-alegre
    name: Itirapina – Campo Alegre
    from: itirapina
    to: campo-alegre
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: medium
    geometry_note: >-
      Traçado atual. Até 1916 o ramal saía de Visconde do Rio Claro (Feijão) e passava pela velha Itirapina (Morro Pelado), cerca de 1 km dali; Campo Alegre "sempre permaneceu no mesmo local".
    status_history:
      - status: open
        from: '1885-07-01'
        sources: [ giesbrecht-campo-alegre, giesbrecht-itirapina-velha ]
        note: Ramal de Jaú da Companhia Rio-Clarense, bitola métrica. Bitola larga a partir de 1941.
      - *to-freight

  - id: cp-campo-alegre-brotas
    name: Campo Alegre – Brotas (aproximado)
    from: campo-alegre
    to: brotas
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: low
    geometry_note: >-
      Desenhado sobre o traçado atual. "Em 1929 foi concluída a construcção da variante das proximidades da cidade de Brotas e a da de Torrinha a Dous Córregos" (relatório de 1930); a estação de Brotas, "a terceira desde 1885", foi construída fora da cidade. O leito antigo ainda não está mapeado.
    status_history:
      - status: open
        from:
          - { value: '1885', source: giesbrecht-brotas, note: Brotas tem estação desde 1885. }
      - *to-freight

  - id: cp-brotas-dois-corregos
    name: Brotas – Dois Córregos (aproximado)
    from: brotas
    to: dois-corregos
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: low
    geometry_note: Desenhado sobre o traçado atual; a variante de Torrinha a Dois Córregos é de 1929 (relatório de 1930) e a variante na serra de Brotas estava em obras em 1930.
    status_history:
      - status: open
        from: '1886-09-07'
        sources: [ giesbrecht-dois-corregos ]
      - *to-freight

  - id: cp-ramal-jau-mineiros
    name: Ramal de Jaú — Dois Córregos – Mineiros – Jaú (esquemático)
    from: dois-corregos
    to: jau
    alignment: branch
    geometry: { method: waypoints, points: [ [ -48.4505, -22.4133 ] ] }
    geometry_confidence: low
    geometry_note: >-
      Linha reta passando por Mineiros: o leito do ramal métrico original (Dois Córregos, Mineiros, Banharão, Jaú) ainda não está mapeado. A estação de Jaú de 1887 ficava em outro ponto.
    status_history:
      - status: open
        from: '1887'
        sources: [ giesbrecht-jau, giesbrecht-dois-corregos ]
        note: Ponta do Ramal de Jaú da Companhia Rio-Clarense.
      - status: closed
        from:
          - { value: '1941-11-15', source: giesbrecht-jau, preferred: true, note: Inauguração da nova estação de Jaú, no Tronco Oeste. }
          - { value: '1941', source: cpef-rel-1942-abril, note: '"Foram suprimidos os trechos ... de Mineiros a Jaú, com 23,742 quilômetros." O trecho Dois Córregos–Mineiros seguiu como ramal; sua data de fechamento ainda precisa de fonte.' }

  - id: cp-tronco-oeste-dois-corregos-jau
    name: Tronco Oeste — Dois Córregos – Lacerda Franco – Jaú (1941)
    from: dois-corregos
    to: jau
    alignment: variant
    replaces: [ cp-ramal-jau-mineiros ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - &to-1941
        status: open
        from:
          - { value: '1941-11-15', source: giesbrecht-jau, preferred: true, note: Inauguração da nova estação de Jaú; a eletrificação Itirapina–Jaú também ficou pronta em 15/11/1941. }
          - { value: '1941', source: cpef-rel-1942-abril, note: '"Foram inaugurados ... o trecho da nova linha de Dous Córregos a Jaú e à margem esquerda do Tietê, com a extensão de 43,472 quilômetros."' }
      - *to-freight

  # ------------------------------------------------------------------
  # Ramal dos Agudos (Paulista, bitola métrica): Dois Córregos → Campos Salles (1899) → Pederneiras (1903)
  # ------------------------------------------------------------------
  - id: cp-agudos-dois-corregos-campos-salles
    name: Ramal dos Agudos — Dois Córregos – Capim Fino – Campos Salles (esquemático)
    from: dois-corregos
    to: campos-salles
    alignment: branch
    geometry: { method: waypoints, points: [ [ -48.4388, -22.4562 ] ] }
    geometry_confidence: low
    geometry_note: Linha reta passando por Capim Fino; o leito (Saldanha Marinho, Capim Fino, Falcão Filho, Campos Salles) ainda não está mapeado.
    status_history:
      - status: open
        from: '1899-07-01'
        sources: [ cpef-rel-1903-jun ]
        note: '"Em 1.º de Julho de 1899 inauguraram-se Saldanha Marinho, Capim Fino, Falcão Filho e Campos Salles."'
      - status: closed
        from: '1941'
        sources: [ cpef-rel-1942-abril ]
        note: Suprimido o trecho Dois Córregos–Capim Fino (17,242 km); Capim Fino–Campos Salles passou a ser servido por uma nova ligação a partir de Mineiros.

  - id: cp-agudos-campos-salles-ayrosa
    name: Ramal dos Agudos — Campos Salles – Iguatemi – Ayrosa Galvão (esquemático)
    from: campos-salles
    to: ayrosa-galvao
    alignment: branch
    geometry: { method: waypoints, points: [ [ -48.6223, -22.4211 ] ] }
    geometry_confidence: low
    geometry_note: Linha reta passando por Iguatemi; o leito ainda não está mapeado.
    status_history:
      - status: open
        from: '1903-03-25'
        sources: [ cpef-rel-1904-jun ]
        note: '"Em data de 25 de março ficou concluído e abriu-se ao trafego o trecho do ramal dos Agudos comprehendido entre as estações de Campos Salles e Ayrosa Galvão."'
      - status: closed
        from: '1941'
        sources: [ cpef-rel-1942-abril ]
        note: Suprimido o trecho de Iguatemi ao km 56,332 (14,307 km), substituído pela bifurcação de Airosa Galvão no Tronco Oeste.

  - id: cp-agudos-ayrosa-pederneiras
    name: Ayrosa Galvão – ponte do Tietê – Pederneiras
    from: ayrosa-galvao
    to: pederneiras
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: medium
    geometry_note: Traçado atual, que cruza o Tietê; a ponte metálica de 400 m de 1903 provavelmente ficava no mesmo ponto (a confirmar).
    status_history:
      - status: open
        from: '1903-10-01'
        sources: [ cpef-rel-1904-jun ]
        note: '"Foi inaugurado o prolongamento do mesmo ramal até á villa de Pederneiras, na margem esquerda do Tietê, tendo a linha atravessado o rio por meio de notável ponte metálica de 400 metros de comprimento, a mais extensa que existe hoje em território de S. Paulo."'
      - *to-freight

  - id: cp-tronco-oeste-jau-ayrosa
    name: Tronco Oeste — Jaú – Ave Maria – Ayrosa Galvão (1941)
    from: jau
    to: ayrosa-galvao
    alignment: variant
    replaces: [ cp-agudos-campos-salles-ayrosa ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
