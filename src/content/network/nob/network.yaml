# E.F. Noroeste do Brasil — trecho paulista (Bauru → rio Paraná)
#
# Rede de trechos versionados. Cada trecho liga dois nós e tem um histórico
# de status com fonte. A geometria de cada trecho é gerada a partir do
# OpenStreetMap por `npm run import-osm` e gravada em geometry.geojson.
#
# Métodos de geometria:
#   osm-current  menor caminho sobre a via atual (railway=rail)
#   osm-old      menor caminho sobre restos de via (abandoned/razed/disused)
#   waypoints    linha esquemática por pontos escolhidos à mão (baixa confiança)
#   manual       desenhado à mão (QGIS/geojson.io/Allmaps) — não é sobrescrito
#
# Datas: YYYY, YYYY-MM ou YYYY-MM-DD. Quando as fontes divergem, use uma lista
# de afirmações (claims) com `source` e marque uma como `preferred`.

line: nob
name: Estrada de Ferro Noroeste do Brasil — trecho paulista
bbox: [ -51.80, -22.45, -48.95, -20.55 ]

nodes:
  - id: bauru
    name: Bauru
    kind: endpoint
    coords: [ -49.069148, -22.315999 ]
    note: Ponto inicial da NOB. Posição aproximada (centro de Bauru), ajustada à via atual.
  - id: presidente-alves
    name: Presidente Alves
    kind: station
    coords: [ -49.440131, -22.100677 ]
  - id: lauro-muller
    name: Lauro Müller (Guarantã)
    kind: station
    coords: [ -49.594493, -21.895081 ]
    note: Posição aproximada, pela sede de Guarantã.
  - id: jct-cafelandia-leste
    name: Junção leste de Cafelândia
    kind: junction
    coords: [ -49.605532, -21.796574 ]
    note: Onde o leito arrasado da linha original de Cafelândia se aproxima da via atual (ponto aproximado; a ligação exata não está no OSM).
  - id: jct-lins-leste
    name: Junção leste de Lins
    kind: junction
    coords: [ -49.69139, -21.69214 ]
    note: Onde o leito antigo de Lins encosta na via atual (OSM).
  - id: jct-guaicara-oeste
    name: Junção oeste de Guaiçara
    kind: junction
    coords: [ -49.797744, -21.603328 ]
    note: Ponto da via atual mais próximo do fim do leito antigo de Guaiçara (Av. Paulo Xavier Ribeiro); aproximado.
  - id: avanhandava
    name: Avanhandava
    kind: station
    station: avanhandava
    coords: [ -49.950045, -21.463288 ]
  - id: penapolis
    name: Penápolis
    kind: station
    station: penapolis
    coords: [ -50.077503, -21.416841 ]
  - id: glicerio-leito-fim-leste
    name: Extremo leste do leito antigo de Glicério
    kind: endpoint
    snap: old
    coords: [ -50.16329, -21.38698 ]
    note: Fim do leito antigo mapeado no OSM. Entre este ponto e Penápolis o traçado original é desconhecido.
  - id: jct-glicerio-oeste
    name: Junção oeste de Glicério
    kind: junction
    coords: [ -50.23675, -21.38272 ]
    note: Onde o leito antigo de Glicério reencontra a via atual (OSM).
  - id: jct-coroados-oeste
    name: Junção oeste de Coroados
    kind: junction
    coords: [ -50.28891, -21.34990 ]
    note: Onde a Variante Coroados–Guatambu (1969) se separa da linha original que entrava no centro de Birigui (OSM).
  - id: jct-guatambu
    name: Junção de Guatambu
    kind: junction
    coords: [ -50.39205, -21.26205 ]
    note: Onde a Variante Coroados–Guatambu (1969) reencontra a linha original (OSM).
  - id: jct-aracatuba-leste
    name: Junção leste de Araçatuba
    kind: junction
    coords: [ -50.42198, -21.24176 ]
    note: Início do contorno ferroviário de Araçatuba (1992), que tirou a linha do centro da cidade (OSM).
  - id: aracatuba-centro
    name: Araçatuba (centro)
    kind: station
    station: aracatuba
    snap: old
    coords: [ -50.439009, -21.203282 ]
    note: Pátio central de Araçatuba, hoje Plataforma Ferroviária (OSM).
  - id: jct-aracatuba-oeste
    name: Junção oeste de Araçatuba
    kind: junction
    coords: [ -50.50980, -21.22321 ]
    note: Fim do contorno de 1992, onde ele encontra a Variante de Jupiá (OSM).
  - id: ramal-lussanvira-fim-mapeado
    name: Fim do leito mapeado do Ramal de Lussanvira
    kind: endpoint
    snap: old
    coords: [ -50.52303, -21.13486 ]
    note: Daqui em diante o leito original não está no OpenStreetMap.
  - id: lussanvira
    name: Lussanvira
    kind: station
    station: lussanvira
    snap: none
    coords: [ -51.100, -20.668 ]
    note: >-
      Posição ESTIMADA, na margem do Tietê oposta a Pereira Barreto. A estação foi submersa pela represa de Três Irmãos em 1990. Precisa ser localizada em mapa antigo.
  - id: itapura
    name: Itapura
    kind: station
    station: itapura
    snap: none
    coords: [ -51.5084, -20.6435 ]
    note: >-
      Posição ESTIMADA (sede atual de Itapura). A estação original "ficava longe da cidade" e a região foi inundada em 1968 pelas barragens de Jupiá e Ilha Solteira.
  - id: guararapes
    name: Guararapes
    kind: station
    station: guararapes
    coords: [ -50.6419, -21.2578 ]
  - id: valparaiso
    name: Valparaíso
    kind: station
    station: valparaiso
    coords: [ -50.870812, -21.224808 ]
  - id: guaracai
    name: Guaraçaí
    kind: station
    station: guaracai
    coords: [ -51.211551, -21.033072 ]
  - id: jupia
    name: Jupiá (margem paulista do rio Paraná)
    kind: bridge
    coords: [ -51.62325, -20.79110 ]
    note: Cabeceira paulista da Ponte Francisco de Sá (1926) sobre o rio Paraná (OSM).

segments:
  # ------------------------------------------------------------------
  # Linha original: a "ponta dos trilhos" avança de Bauru (1906) ao Paraná (1910)
  # ------------------------------------------------------------------
  - id: nob-bauru-presidente-alves
    name: Bauru – Presidente Alves
    from: bauru
    to: presidente-alves
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: medium
    geometry_note: &variantes-bauru-penapolis >-
      Traçado atual. Antes de 1960 houve retificações entre Bauru e Cafelândia ainda não mapeadas: Paredão estava no km 133,3 em 1949 e no km 117,1 em 1960.
    status_history:
      - status: open
        from: '1906-09'
        sources: [ giesbrecht-avanhandava ]
      - &freight-1995
        status: freight_only
        from:
          - { value: '1995', circa: true, source: giesbrecht-birigui, preferred: true }
          - { value: '1996', source: wikipedia-pt-nob, note: 'Somente carga a partir de 1996, após a privatização.' }

  - id: nob-presidente-alves-lauro-muller
    name: Presidente Alves – Lauro Müller
    from: presidente-alves
    to: lauro-muller
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: medium
    geometry_note: *variantes-bauru-penapolis
    status_history:
      - status: open
        from:
          - { value: '1907-01', source: giesbrecht-avanhandava, preferred: true }
          - { value: '1906-09-29', source: wikipedia-pt-nob, note: 'Dá o primeiro trecho, até Lauro Müller (km 92), aberto já em 29/09/1906.' }
      - *freight-1995

  - id: nob-lauro-muller-cafelandia
    name: Lauro Müller – Cafelândia
    from: lauro-muller
    to: jct-cafelandia-leste
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: medium
    geometry_note: *variantes-bauru-penapolis
    status_history:
      - status: open
        from: '1908-02-16'
        sources: [ giesbrecht-avanhandava, giesbrecht-cafelandia-velha ]
        note: Trecho até Avanhandava inaugurado com a presença do presidente Afonso Pena.
      - *freight-1995

  # ------------------------------------------------------------------
  # Variante de Lins: Lins (1962) e Cafelândia (1970)
  # ------------------------------------------------------------------
  - id: nob-cafelandia-lins-original
    name: Cafelândia – Paredão – Lins, linha original
    from: jct-cafelandia-leste
    to: jct-lins-leste
    alignment: original
    geometry:
      method: osm-old
      max_gap_m: 5000
      # meio do leito arrasado de Cafelândia (OSM way 536115541)
      via: [ [ -49.63823, -21.75860 ] ]
    geometry_confidence: medium
    geometry_note: >-
      Leito arrasado mapeado no OSM em torno de Cafelândia (cerca de 14 km). Perto de Lins o leito não está mapeado e foi completado pelo caminho mais curto.
    status_history:
      - status: open
        from: '1908-02-16'
        sources: [ giesbrecht-cafelandia-velha ]
      - status: closed
        from: '1970'
        sources: [ giesbrecht-cafelandia-velha, giesbrecht-paredao ]
        note: Abertura da variante de Lins no trecho de Cafelândia; a estação original foi demolida.

  - id: nob-variante-lins-cafelandia
    name: Variante de Lins — trecho de Cafelândia (1970)
    from: jct-cafelandia-leste
    to: jct-lins-leste
    alignment: variant
    replaces: [ nob-cafelandia-lins-original ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1970'
        sources: [ giesbrecht-cafelandia, giesbrecht-paredao ]
      - *freight-1995

  - id: nob-lins-guaicara-original
    name: Lins (centro) – Guaiçara, linha original
    from: jct-lins-leste
    to: jct-guaicara-oeste
    alignment: original
    geometry:
      method: osm-old
      max_gap_m: 1500
      # estações velhas de Lins (hoje museu) e de Guaiçara (hoje Estação Criatividade)
      via: [ [ -49.74607, -21.67626 ], [ -49.79647, -21.62323 ] ]
    geometry_confidence: medium
    geometry_note: >-
      Leito antigo mapeado no OSM: em Lins virou a Av. Arquiteto Luiz Saia; em Guaiçara, a Av. Duque de Caxias e a Av. Paulo Xavier Ribeiro. Pequenos trechos sem mapeamento foram completados em linha reta.
    status_history:
      - status: open
        from: '1908-02-16'
        sources: [ giesbrecht-lins-velha ]
      - status: closed
        from:
          - { value: '1962-11-15', source: giesbrecht-lins-velha, preferred: true, note: Estação de Lins desativada com a abertura da variante. }
          - { value: '1963', source: giesbrecht-guaicara, note: '"Em 1963, com a variante de Lins, a estação [de Guaiçara] mudou de posição."' }

  - id: nob-variante-lins
    name: Variante de Lins (1962)
    from: jct-lins-leste
    to: jct-guaicara-oeste
    alignment: variant
    replaces: [ nob-lins-guaicara-original ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from:
          - { value: '1962-11-15', source: giesbrecht-lins, preferred: true, note: Inauguração da nova estação de Lins; a variante já recebia cargueiros em teste desde março de 1962. }
          - { value: '1963', source: giesbrecht-guaicara }
      - *freight-1995

  - id: nob-guaicara-avanhandava
    name: Guaiçara – Promissão – Capituva – Avanhandava, linha original (aproximada)
    from: jct-guaicara-oeste
    to: avanhandava
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: low
    geometry_note: >-
      Desenhado sobre a via atual porque o leito original não está mapeado. A linha original passava pelo centro de Promissão (Av. Noroeste, Av. da Saudade) e por Capituva, e era mais longa: em 1949 Promissão (km 177,5) estava a cerca de 42 km de Penápolis (km 219,6), contra 29 km hoje.
    status_history:
      - status: open
        from: '1908-02-16'
        sources: [ giesbrecht-promissao, giesbrecht-avanhandava ]
      - status: closed
        from: '1970-08-15'
        sources: [ giesbrecht-promissao ]
        note: Substituída em etapas pela variante Lins–Araçatuba (Promissão em 15/08/1970; Capituva desativada em 1971).

  - id: nob-variante-promissao
    name: Variante Lins–Araçatuba — Guaiçara – Promissão – Avanhandava (1970)
    from: jct-guaicara-oeste
    to: avanhandava
    alignment: variant
    replaces: [ nob-guaicara-avanhandava ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1970-08-15'
        sources: [ giesbrecht-promissao ]
        note: Data da retirada da linha do centro de Promissão; o trecho de Capituva parece ter sido concluído em 1971.
      - *freight-1995

  - id: nob-avanhandava-penapolis
    name: Avanhandava – Urutágua – Penápolis, linha original (aproximada)
    from: avanhandava
    to: penapolis
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: low
    geometry_note: Desenhado sobre a via atual porque o leito original, que passava por Urutágua, não está mapeado.
    status_history:
      - status: open
        from: '1908-12-02'
        sources: [ giesbrecht-penapolis ]
      - status: closed
        from: '1971'
        circa: true
        sources: [ giesbrecht-urutagua ]
        note: Urutágua "parece ter sido desativado devido à retificação da linha entre Lins e Araçatuba, em 1971".

  - id: nob-variante-urutagua
    name: Variante Lins–Araçatuba — Avanhandava – Penápolis (c. 1971)
    from: avanhandava
    to: penapolis
    alignment: variant
    replaces: [ nob-avanhandava-penapolis ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1971'
        circa: true
        sources: [ giesbrecht-urutagua ]
      - *freight-1995

  # ------------------------------------------------------------------
  # Variante de Glicério (18/03/1969), parte da variante Lins–Araçatuba
  # ------------------------------------------------------------------
  - id: nob-penapolis-glicerio-esquematico
    name: Penápolis – Bonito – Eng. Napoleão, linha original (esquemático)
    from: penapolis
    to: glicerio-leito-fim-leste
    alignment: original
    geometry: { method: waypoints, points: [] }
    geometry_confidence: low
    geometry_note: >-
      Linha reta: o leito entre Penápolis e o extremo leste do leito mapeado de Glicério não é conhecido. O traçado real era mais longo: em 1949 Penápolis (km 219,6) e Glicério (km 239,8) distavam 20,2 km, contra cerca de 16 km no mapa.
    status_history:
      - status: open
        from: '1908-12-02'
        sources: [ giesbrecht-penapolis ]
      - status: closed
        from: '1969-03-18'
        sources: [ giesbrecht-glicerio ]
        note: Bonito e Engenheiro Napoleão, que ficavam neste trecho, já não existiam em 1970.

  - id: nob-glicerio-original
    name: Glicério (centro), linha original
    from: glicerio-leito-fim-leste
    to: jct-glicerio-oeste
    alignment: original
    geometry: { method: osm-old }
    geometry_confidence: medium
    geometry_note: Leito antigo mapeado no OSM; em Glicério virou a Estrada Municipal GLI-030 e a Av. Adolfo Hecht Júnior.
    status_history:
      - status: open
        from: '1908-12-02'
        sources: [ giesbrecht-penapolis, giesbrecht-glicerio ]
      - status: closed
        from: '1969-03-18'
        sources: [ giesbrecht-glicerio ]

  - id: nob-variante-glicerio
    name: Variante de Glicério (1969)
    from: penapolis
    to: jct-glicerio-oeste
    alignment: variant
    replaces: [ nob-penapolis-glicerio-esquematico, nob-glicerio-original ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1969-03-18'
        sources: [ giesbrecht-glicerio ]
        note: Aberta no mesmo dia da nova estação de Glicério, como parte da variante Lins–Araçatuba.
      - *freight-1995

  - id: nob-glicerio-coroados
    name: Glicério – Coroados
    from: jct-glicerio-oeste
    to: jct-coroados-oeste
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1908-12-02'
        sources: [ giesbrecht-aracatuba-1 ]
      - *freight-1995

  - id: nob-coroados-birigui-guatambu-original
    name: Coroados – Birigui (centro) – Guatambu, linha original
    from: jct-coroados-oeste
    to: jct-guatambu
    alignment: original
    geometry:
      method: osm-old
      # passa pela antiga estação de Birigui, "no centro da cidade, a umas três quadras da igreja matriz"
      via: [ [ -50.33674, -21.29015 ] ]
    geometry_confidence: high
    geometry_note: >-
      Leito antigo bem preservado no OpenStreetMap: em Birigui virou a Av. José Agostinho Rossi, a Rua Fernando Castilho, a Rua José Pacitti e a Rodovia Vicinal José Fernandes Barbiere.
    status_history:
      - status: open
        from: '1908-12-02'
        sources: [ giesbrecht-aracatuba-1 ]
      - status: closed
        from:
          - { value: '1969-02-16', source: giesbrecht-birigui, preferred: true, note: 'Variante Birigui–Coroados aberta ao tráfego.' }
          - { value: '1969-03-18', source: giesbrecht-glicerio, note: 'Variante Glicério–Guatambu aberta no mesmo dia da nova estação de Glicério.' }
        note: Trilhos retirados depois; a data da retirada ainda precisa de fonte.

  - id: nob-variante-coroados-guatambu
    name: Variante Coroados – Guatambu (1969)
    from: jct-coroados-oeste
    to: jct-guatambu
    alignment: variant
    replaces: [ nob-coroados-birigui-guatambu-original ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from:
          - { value: '1969-02-16', source: giesbrecht-birigui, preferred: true }
          - { value: '1969-03-18', source: giesbrecht-glicerio }
        note: Parte da grande variante Lins–Araçatuba, executada em etapas entre 1969 e 1971.
      - *freight-1995

  - id: nob-guatambu-aracatuba-leste
    name: Guatambu – Araçatuba (leste)
    from: jct-guatambu
    to: jct-aracatuba-leste
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1908-12-02'
        sources: [ giesbrecht-aracatuba-1 ]
      - *freight-1995

  - id: nob-aracatuba-centro-leste
    name: Entrada de Araçatuba pelo centro
    from: jct-aracatuba-leste
    to: aracatuba-centro
    alignment: original
    geometry: { method: osm-old }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1908-12-02'
        sources: [ giesbrecht-aracatuba-1 ]
      - status: closed
        from: '1992'
        sources: [ giesbrecht-aracatuba-4 ]
        note: A linha deixou o centro, acusada de "cortar a cidade ao meio".

  - id: nob-contorno-aracatuba
    name: Contorno ferroviário de Araçatuba (1992)
    from: jct-aracatuba-leste
    to: jct-aracatuba-oeste
    alignment: bypass
    replaces: [ nob-aracatuba-centro-leste, nob-variante-jupia-aracatuba-centro ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1992'
        sources: [ giesbrecht-aracatuba-4 ]
      - *freight-1995

  # ------------------------------------------------------------------
  # Traçado original pelo vale do Tietê (1910), depois Ramal de Lussanvira
  # ------------------------------------------------------------------
  - id: nob-aracatuba-lussanvira-mapeado
    name: Araçatuba – Engenheiro Taveira (leito do Ramal de Lussanvira)
    from: aracatuba-centro
    to: ramal-lussanvira-fim-mapeado
    alignment: original
    geometry: { method: osm-old }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1910-05-13'
        sources: [ giesbrecht-lussanvira, giesbrecht-itapura ]
      - status: open
        from: '1941-01-20'
        sources: [ giesbrecht-lussanvira ]
        note: Com a Variante de Jupiá, a linha velha passa a ser o Ramal de Lussanvira.
      - status: closed
        from: '1961'
        sources: [ giesbrecht-lussanvira ]
      - status: removed
        from: '1965-08-19'
        sources: [ giesbrecht-lussanvira ]
        note: Erradicação do ramal pela DD-340 de 19/8/1965 (RFFSA).

  - id: nob-lussanvira-esquematico
    name: Engenheiro Taveira – Lussanvira (traçado esquemático)
    from: ramal-lussanvira-fim-mapeado
    to: lussanvira
    alignment: original
    geometry: { method: waypoints, points: [] }
    geometry_confidence: low
    geometry_note: >-
      Linha reta entre pontos conhecidos: o leito real, ao longo do Tietê, ainda não foi mapeado e boa parte está sob a represa de Três Irmãos.
    status_history:
      - status: open
        from: '1910-05-13'
        sources: [ giesbrecht-lussanvira ]
      - status: open
        from: '1941-01-20'
        sources: [ giesbrecht-lussanvira ]
        note: Passa a ser o Ramal de Lussanvira.
      - status: closed
        from: '1961'
        sources: [ giesbrecht-lussanvira ]
      - status: removed
        from: '1965-08-19'
        sources: [ giesbrecht-lussanvira ]
      - status: flooded
        from: '1990-10'
        sources: [ diario-litoral-ponte-novo-oriente, giesbrecht-lussanvira ]
        note: Enchimento do reservatório de Três Irmãos.

  - id: nob-lussanvira-itapura
    name: Lussanvira – Itapura (traçado esquemático)
    from: lussanvira
    to: itapura
    alignment: original
    geometry: { method: waypoints, points: [] }
    geometry_confidence: low
    geometry_note: Linha reta entre posições estimadas; o leito está submerso.
    status_history:
      - status: open
        from: '1910-05-13'
        sources: [ giesbrecht-itapura ]
      - status: closed
        from: '1941-01'
        sources: [ giesbrecht-itapura ]
        note: Trecho Lussanvira–Jupiá abandonado por causa da malária.
      - status: removed
        from: '1941'
        circa: true
        sources: [ giesbrecht-itapura ]
        note: 77 km de trilhos retirados após autorização de 2/12/1940.
      - status: flooded
        from: '1968'
        sources: [ giesbrecht-itapura ]
        note: Barragens de Jupiá e Ilha Solteira.

  - id: nob-itapura-jupia
