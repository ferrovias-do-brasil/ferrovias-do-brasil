# Companhia Mogiana de Estradas de Ferro — tronco Campinas → Ribeirão Preto (1875–1883)
#
# Bitola métrica. O tronco original foi quase todo substituído por variantes entre 1929 e 1979;
# a linha atual (FCA/VLI) é a soma delas. Onde o leito original não está no OpenStreetMap, ele é
# desenhado como aproximado ou esquemático. Datas de abertura dos relatórios da própria Mogiana
# (Arquivo Público do Estado / Memória Ferroviária), conferidas com Giesbrecht.

line: mogiana
name: Companhia Mogiana — tronco Campinas–Ribeirão Preto
bbox: [ -47.95, -22.95, -46.85, -21.10 ]
osm_cache: malha-sp

nodes:
  - id: campinas
    name: Campinas
    kind: station
    snap: old
    coords: [ -47.068286, -22.908944 ]
    note: A Mogiana partia da estação da Paulista em Campinas.
  - id: boa-vista
    name: Boa Vista (Campinas)
    kind: junction
    coords: [ -47.139896, -22.87596 ]
    note: Início da Variante Boa Vista–Guedes (1977), na linha da Paulista.
  - id: jaguari
    name: Jaguari (Jaguariúna)
    kind: station
    station: jaguariuna
    snap: old
    coords: [ -46.994685, -22.703783 ]
  - id: guedes
    name: Guedes
    kind: junction
    coords: [ -46.975124, -22.666777 ]
    note: Ponto aproximado onde a Variante Boa Vista–Guedes encontra o tronco.
  - id: mogi-mirim
    name: Mogi Mirim
    kind: station
    station: mogi-mirim
    snap: old
    coords: [ -46.941251, -22.44952 ]
    note: Ponto APROXIMADO, no trilho mais próximo do centro de Mogi Mirim; a estação original ficava no centro.
  - id: mato-seco
    name: Mato Seco (aproximado)
    kind: junction
    coords: [ -46.960988, -22.266932 ]
    note: Ponto aproximado onde a Variante Guedes–Mato Seco (1979) reencontra o tronco, ao norte de Mogi Guaçu.
  - id: lagoa-branca
    name: Lagoa Branca
    kind: station
    coords: [ -47.034946, -21.892267 ]
    note: Início da Variante Lagoa–Tambaú (1948).
  - id: casa-branca-velha
    name: Casa Branca (estação original)
    kind: station
    station: casa-branca
    snap: none
    coords: [ -47.08521, -21.77431 ]
    note: Posição APROXIMADA, pelo centro da cidade; a estação de 1878 virou ponta do Ramal de Mococa.
  - id: tambau
    name: Tambaú
    kind: junction
    coords: [ -47.271345, -21.697135 ]
  - id: bento-quirino
    name: Bento Quirino
    kind: junction
    coords: [ -47.58458, -21.460665 ]
  - id: ribeirao-preto-velha
    name: Ribeirão Preto (estação original)
    kind: station
    station: ribeirao-preto
    snap: old
    coords: [ -47.815585, -21.160187 ]
    note: Área da antiga estação (1883–1968), hoje Terminal Rodoviário.
  - id: ribeirao-preto-nova
    name: Ribeirão Preto (estação de 1965)
    kind: station
    coords: [ -47.78392, -21.149035 ]

  # ---------------------------------------------------------------- ramais
  - id: pedreira
    name: Pedreira
    kind: station
    snap: old
    coords: [ -46.911942, -22.742722 ]
  - id: amparo
    name: Amparo
    kind: station
    station: amparo
    snap: old
    coords: [ -46.769161, -22.704905 ]
  - id: reversao
    name: Reversão
    kind: junction
    snap: old
    coords: [ -46.686782, -22.687605 ]
    note: Ponto de reversão dos trens entre os ramais de Monte Alegre e de Socorro (desde 1908).
  - id: monte-alegre
    name: Monte Alegre do Sul
    kind: station
    station: monte-alegre-do-sul
    snap: old
    coords: [ -46.683859, -22.687459 ]
  - id: visconde-de-soutelo
    name: Visconde de Soutelo
    kind: station
    snap: old
    coords: [ -46.60954, -22.69528 ]
  - id: socorro
    name: Socorro
    kind: station
    station: socorro
    snap: old
    coords: [ -46.525806, -22.597895 ]
  - id: pantaleao
    name: Pantaleão
    kind: station
    snap: none
    coords: [ -46.8034, -22.63579 ]
  - id: brumado
    name: Brumado
    kind: station
    snap: none
    coords: [ -46.79692, -22.59142 ]
    note: Posição APROXIMADA, pelo bairro do Brumado.
  - id: serra-negra
    name: Serra Negra
    kind: station
    station: serra-negra
    snap: none
    coords: [ -46.69998, -22.61264 ]
    note: Posição APROXIMADA, pelo centro da cidade; a estação, demolida, deu lugar à rodoviária.
  - id: itapira
    name: Itapira (Penha)
    kind: station
    station: itapira
    snap: old
    coords: [ -46.825981, -22.437775 ]
  - id: jct-ramal-mococa
    name: Ramal de Mococa (início do leito mapeado)
    kind: junction
    snap: old
    coords: [ -47.07757, -21.778698 ]
  - id: sao-jose-rio-pardo
    name: São José do Rio Pardo
    kind: station
    station: sao-jose-do-rio-pardo
    snap: old
    coords: [ -46.890903, -21.593919 ]
  - id: ribeiro-do-valle
    name: Ribeiro do Valle
    kind: junction
    snap: old
    coords: [ -46.87986, -21.55708 ]
    note: Saída do Ramal de Guaxupé (1903), não desenhado aqui.
  - id: engenheiro-gomide
    name: Engenheiro Gomide
    kind: station
    snap: old
    coords: [ -46.89147, -21.54494 ]
  - id: mococa
    name: Mococa
    kind: station
    station: mococa
    snap: old
    coords: [ -46.99061, -21.47335 ]
  - id: canoas
    name: Canoas
    kind: station
    snap: old
    coords: [ -46.974154, -21.431758 ]

segments:
  # ------------------------------------------------------------------ Campinas → Jaguari (1875)
  - id: mog-campinas-jaguari
    name: Campinas – Anhumas – Carlos Gomes – Jaguari
    from: campinas
    to: jaguari
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600, via: [ [ -47.02985, -22.85869 ] ] }
    geometry_confidence: medium
    geometry_note: >-
      Leito do trem turístico Campinas–Jaguariúna (ABPF), que segue o tronco original já com a retificação Desembargador Furtado–Jaguari de 18/11/1929 (nova Carlos Gomes, a cerca de 1 km da velha).
    status_history:
      - status: open
        from: '1875-05-03'
        sources: [ cmef-rel-1876 ]
        note: '"Abriu-se o trafego até à estação do Jaguary no dia 3 de Maio de 1875."'
      - status: closed
        from: '1977'
        sources: [ giesbrecht-jaguariuna ]
        note: O tráfego passa para a Variante Boa Vista–Guedes. Desde 1981 o trecho recebe o trem turístico da ABPF.

  - id: mog-variante-boa-vista-guedes
    name: Variante Boa Vista – Guedes (1977)
    from: boa-vista
    to: guedes
    alignment: variant
    replaces: [ mog-campinas-jaguari, mog-jaguari-guedes ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1977'
        sources: [ giesbrecht-jaguariuna ]
      - &mog-freight
        status: freight_only
        from: '1997-08-11'
        sources: [ giesbrecht-ribeirao-preto-nova ]
        note: '"Recebeu passageiros até 11 de agosto de 1997, quando estes trens foram suprimidos."'

  # ------------------------------------------------------------------ Jaguari → Mogi Mirim (1875) → Casa Branca (1878)
  - id: mog-jaguari-guedes
    name: Jaguari – Guedes
    from: jaguari
    to: guedes
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600 }
    geometry_confidence: low
    geometry_note: Leito original não mapeado; desenhado pelo caminho mais curto sobre os trilhos existentes.
    status_history:
      - &mm-open
        status: open
        from: '1875-08-27'
        sources: [ cmef-rel-1876 ]
        note: '"E em 27 de Agosto até Mogy-mirim."'
      - status: closed
        from: '1977'
        sources: [ giesbrecht-jaguariuna ]
        note: Com a Variante Boa Vista–Guedes, os trens deixam de passar por Jaguariúna.

  - id: mog-guedes-mogi-mirim
    name: Guedes – Mogi Mirim (aproximado)
    from: guedes
    to: mogi-mirim
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600 }
    geometry_confidence: low
    geometry_note: Leito original não mapeado; desenhado pelo caminho mais curto até o centro de Mogi Mirim.
    status_history:
      - *mm-open
      - status: removed
        from: '1979'
        sources: [ giesbrecht-mogi-mirim ]
        note: '"Os trilhos foram retirados, em 1979, com a construção da variante Guedes–Mato Seco."'

  - id: mog-mogi-mirim-mato-seco
    name: Mogi Mirim – Mogi Guaçu – Mato Seco (aproximado)
    from: mogi-mirim
    to: mato-seco
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600, via: [ [ -46.9425, -22.37222 ] ] }
    geometry_confidence: low
    geometry_note: Leito original não mapeado; passa pelo centro de Mogi Guaçu.
    status_history:
      - status: open
        from:
          - { value: '1878-01-14', source: giesbrecht-casa-branca, note: Data da chegada a Casa Branca; Mogi Guaçu pode ter sido aberta antes. }
      - status: removed
        from: '1979'
        sources: [ giesbrecht-mogi-mirim ]

  - id: mog-variante-guedes-mato-seco
    name: Variante Guedes – Mato Seco (1979)
    from: guedes
    to: mato-seco
    alignment: variant
    replaces: [ mog-guedes-mogi-mirim, mog-mogi-mirim-mato-seco ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1979'
        sources: [ giesbrecht-mogi-mirim ]
        note: Contorna Mogi Mirim e Mogi Guaçu, com estações novas fora das cidades.
      - *mog-freight

  - id: mog-mato-seco-lagoa
    name: Mato Seco – Lagoa Branca (aproximado)
    from: mato-seco
    to: lagoa-branca
    alignment: original
    geometry: { method: osm-current }
    geometry_confidence: low
    geometry_note: Desenhado sobre a linha atual; o tronco original pode ter tido outro traçado neste trecho.
    status_history:
      - status: open
        from: '1878-01-14'
        sources: [ giesbrecht-casa-branca ]
      - *mog-freight

  # ------------------------------------------------------------------ Casa Branca (1878) → São Simão (1882) → Ribeirão Preto (1883)
  - id: mog-lagoa-casa-branca
    name: Lagoa Branca – Casa Branca (estação original, esquemático)
    from: lagoa-branca
    to: casa-branca-velha
    alignment: original
    geometry: { method: waypoints, points: [] }
    geometry_confidence: low
    geometry_note: Linha reta até o centro de Casa Branca; o leito original não está mapeado.
    status_history:
      - status: open
        from: '1878-01-14'
        sources: [ giesbrecht-casa-branca ]
        note: Ponta da linha até 1882.
      - status: closed
        from: '1948-12'
        sources: [ giesbrecht-casa-branca ]
        note: A Variante Lagoa–Tambaú tira o tronco da cidade; a velha estação vira ponta do Ramal de Mococa até 1988.

  - id: mog-casa-branca-tambau
    name: Casa Branca – Tambaú (esquemático)
    from: casa-branca-velha
    to: tambau
    alignment: original
    geometry: { method: waypoints, points: [] }
    geometry_confidence: low
    geometry_note: Linha reta; o leito original não está mapeado.
    status_history:
      - &ss-open
        status: open
        from: '1882-08-16'
        sources: [ cmef-rel-1882 ]
        note: '"Concessão para a abertura ao trafego até á Villa de S. Simão, no dia 16 d''Agosto próximo passado foi ella inaugurada."'
      - status: closed
        from: '1948-12'
        sources: [ giesbrecht-casa-branca ]

  - id: mog-variante-lagoa-tambau
    name: Variante Lagoa – Casa Branca – Tambaú (1948)
    from: lagoa-branca
    to: tambau
    alignment: variant
    replaces: [ mog-lagoa-casa-branca, mog-casa-branca-tambau ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1948-12'
        sources: [ giesbrecht-casa-branca ]
        note: A nova estação de Casa Branca, na variante, é de 1951.
      - *mog-freight

  - id: mog-tambau-sao-simao-original
    name: Tambaú – São Simão (centro) – Bento Quirino, linha original (aproximado)
    from: tambau
    to: bento-quirino
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600, via: [ [ -47.5523, -21.47987 ] ] }
    geometry_confidence: low
    geometry_note: O leito original pelo centro de São Simão virou avenida e não está mapeado como ferrovia.
    status_history:
      - *ss-open
      - status: closed
        from: '1971-02-25'
        sources: [ giesbrecht-sao-simao ]
        note: '"Desativada em 25/02/1971, quando uma nova estação foi entregue na linha nova, fora do centro da cidade e na variante Tambaú–Bento Quirino."'

  - id: mog-variante-tambau-bento-quirino
    name: Variante Tambaú – Bento Quirino (1971)
    from: tambau
    to: bento-quirino
    alignment: variant
    replaces: [ mog-tambau-sao-simao-original ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1971-02-25'
        sources: [ giesbrecht-sao-simao ]
      - *mog-freight

  - id: mog-bento-quirino-ribeirao-original
    name: Bento Quirino – Cravinhos – Ribeirão Preto, linha original (aproximado)
    from: bento-quirino
    to: ribeirao-preto-velha
    alignment: original
    geometry: { method: osm-old, max_gap_m: 600, via: [ [ -47.72944, -21.34027 ] ] }
    geometry_confidence: low
    geometry_note: Leito original mapeado só na entrada de Ribeirão Preto ("Linha Tronco antiga (Mogiana)"); o resto, pelo centro de Cravinhos, é aproximado.
    status_history:
      - status: open
        from:
          - { value: '1883-11-23', source: giesbrecht-ribeirao-preto, preferred: true }
          - { value: '1883', source: cmef-rel-1885, note: 'O relatório de 1885 confirma que no 1.º semestre de 1883 o tráfego ia "somente até a estação de S. Simão"; o relatório de 1884, que traria a data, não está no acervo.' }
      - status: closed
        from: '1964-05-01'
        sources: [ giesbrecht-cravinhos ]
        note: Desativada a estação de Cravinhos; a velha estação de Ribeirão Preto passa a ser "Ribeirão Preto-ramal" em 1965 e é erradicada em 1968–1969.

  - id: mog-variante-bento-quirino-entroncamento
    name: Variante Bento Quirino – Entroncamento (Ribeirão Preto, 1961–1965)
    from: bento-quirino
    to: ribeirao-preto-nova
    alignment: variant
    replaces: [ mog-bento-quirino-ribeirao-original ]
    geometry: { method: osm-current }
    geometry_confidence: high
    status_history:
      - status: open
        from:
          - { value: '1964-05-01', source: giesbrecht-cravinhos, preferred: true, note: Passageiros transferidos para a variante. }
          - { value: '1961', source: giesbrecht-ribeirao-preto, note: Variante concluída no fim de 1961. }
        note: A nova estação de Ribeirão Preto é de 1/6/1965.
      - *mog-freight

  # ================================================================== RAMAIS
  # ------------------------------------------------------------------ Ramal de Amparo (1875) e prolongamento a Monte Alegre (1890)
  - id: mog-ramal-amparo-pedreira
    name: Ramal de Amparo – Jaguari a Pedreira
    from: jaguari
    to: pedreira
    alignment: branch
    geometry: { method: osm-old, max_gap_m: 800 }
    geometry_confidence: medium
    geometry_note: Leito do ramal mapeado no OpenStreetMap. Desde 1945 o ramal saía da nova estação de Jaguariúna, na Variante Guanabara–Guedes (não desenhada).
    status_history:
      - status: open
        from: '1875-11-10'
        sources: [ giesbrecht-pedreira ]
      - &amparo-closed
        status: closed
        from: '1967'
        sources: [ giesbrecht-amparo ]
        note: Extinto o que restava do ramal; os trilhos foram retirados pouco depois.

  - id: mog-ramal-amparo-pedreira-amparo
    name: Ramal de Amparo – Pedreira, Arcadas e Amparo
    from: pedreira
    to: amparo
    alignment: branch
    geometry: { method: osm-old, max_gap_m: 5000 }
    geometry_confidence: medium
    geometry_note: Leito mapeado com lacunas perto de Arcadas, fechadas em linha reta.
    status_history:
      - status: open
        from:
          - { value: '1875-11-15', source: giesbrecht-amparo, preferred: true }
          - { value: '1875', source: cmef-rel-1876, note: O relatório de 1876 já traz o movimento da estação de Amparo no 2.º semestre de 1875. }
        note: Primeiro ramal da Mogiana.
      - *amparo-closed

  - id: mog-amparo-reversao
    name: Prolongamento Amparo – Três Pontes – Reversão
    from: amparo
    to: reversao
    alignment: branch
    geometry: { method: osm-old, max_gap_m: 5000 }
    geometry_confidence: low
    geometry_note: Leito mapeado em pedaços; uma lacuna de quase 5 km depois de Três Pontes foi fechada em linha reta.
    status_history:
      - &monte-alegre-open
        status: open
        from:
          - { value: '1890-03-02', source: giesbrecht-tres-pontes, preferred: true }
          - { value: '1890-01-02', source: giesbrecht-monte-alegre-do-sul, note: Data dada pelo Guia Geral das Estradas de Ferro e pelo jornal O Estado de S. Paulo, segundo Giesbrecht. }
      - status: closed
        from: '1966-09-16'
        sources: [ giesbrecht-socorro-mogiana ]
        note: Fecha com o Ramal de Socorro, cujos trens passavam por aqui. Giesbrecht também diz que o tráfego Amparo–Monte Alegre foi suprimido em 1965; conferir.

  - id: mog-reversao-monte-alegre
    name: Reversão – Monte Alegre
    from: reversao
    to: monte-alegre
    alignment: branch
    geometry: { method: osm-old, max_gap_m: 1500 }
    geometry_confidence: low
    status_history:
      - *monte-alegre-open
      - status: closed
        from: '1965'
        sources: [ giesbrecht-amparo ]
        note: '"Em 1965, o tráfego de trens foi suprimido entre Amparo e Monte Alegre."'

  # ------------------------------------------------------------------ Ramal de Socorro (1908–1909)
  - id: mog-ramal-socorro-soutelo
    name: Ramal de Socorro – Reversão a Visconde de Soutelo
    from: reversao
    to: visconde-de-soutelo
    alignment: branch
    geometry: { method: osm-old, max_gap_m: 800 }
    geometry_confidence: high
    status_history:
      - status: open
        from: '1908-08-01'
        sources: [ cmef-rel-1909 ]
        note: '"... 14 do ramal de Soccorro, inaugurados em 1.° de Agosto de 1908."'
      - &socorro-closed
        status: closed
        from: '1966-09-16'
        sources: [ giesbrecht-socorro-mogiana ]

  - id: mog-ramal-socorro-soutelo-socorro
    name: Ramal de Socorro – Visconde de Soutelo, Barão de Ibitinga e Socorro
    from: visconde-de-soutelo
    to: socorro
    alignment: branch
    geometry: { method: osm-old, max_gap_m: 800 }
    geometry_confidence: high
    status_history:
      - status: open
        from:
          - { value: '1909-04-21', source: cmef-rel-1909, preferred: true, note: '"Concluída a construcção, foi aberto ao trafego até o ponto terminal «Estação de Soccorro» em 21 de Abril do corrente anno."' }
          - { value: '1909-04-24', source: cmef-rel-1910, note: O relatório seguinte dá 24 de abril para a abertura das estações de Barão de Ibitinga e Socorro. }
      - *socorro-closed

  # ------------------------------------------------------------------ Ramal de Serra Negra (1889–1892)
  - id: mog-ramal-serra-negra-pantaleao
    name: Ramal de Serra Negra – Amparo a Pantaleão (aproximado)
    from: amparo
    to: pantaleao
    alignment: branch
    geometry: { method: waypoints, points: [ [ -46.785, -22.67 ] ] }
    geometry_confidence: low
    geometry_note: Leito não mapeado; desenho esquemático.
    status_history:
      - status: open
        from: '1889-12-15'
        sources: [ giesbrecht-pantaleao ]
      - &serra-negra-closed
        status: closed
        from: '1956'
        sources: [ giesbrecht-serra-negra ]
        note: Extinto o tráfego no ramal.

  - id: mog-ramal-serra-negra-brumado
    name: Ramal de Serra Negra – Pantaleão a Brumado (aproximado)
    from: pantaleao
    to: brumado
    alignment: branch
    geometry: { method: waypoints, points: [] }
    geometry_confidence: low
    geometry_note: Leito não mapeado; linha reta.
    status_history:
      - status: open
        from: '1890-09-11'
        sources: [ cmef-rel-1891-abril ]
        note: '"Em 11 de Setembro foi aberta ao trafego a estação de Brumado no Ramal de Silveiras."'
      - *serra-negra-closed

  - id: mog-ramal-serra-negra-final
    name: Ramal de Serra Negra – Brumado, Santo Aleixo e Serra Negra (aproximado)
    from: brumado
    to: serra-negra
    alignment: branch
    geometry: { method: waypoints, points: [] }
    geometry_confidence: low
    geometry_note: Leito não mapeado; linha reta.
    status_history:
      - status: open
        from: '1892-03-28'
        sources: [ giesbrecht-serra-negra, cmef-rel-1893 ]
        note: O relatório da Mogiana registra Serra Negra e Santo Aleixo entre as estações entregues ao público em 1892.
      - *serra-negra-closed

  # ------------------------------------------------------------------ Ramal da Penha / de Itapira (1882)
  - id: mog-ramal-itapira
    name: Ramal da Penha (Itapira)
    from: mogi-mirim
    to: itapira
    alignment: branch
    geometry: { method: osm-old, max_gap_m: 800 }
    geometry_confidence: high
    geometry_note: Leito do ramal mapeado no OpenStreetMap.
    status_history:
      - status: open
        from:
          - { value: '1882-07-30', source: cmef-rel-1882, preferred: true, note: '"A 30 de Julho passado teve lugar a inauguração d''este Ramal."' }
          - { value: '1882-06-30', source: giesbrecht-itapira, note: Data da estação da Penha, segundo Giesbrecht. }
      - status: freight_only
        from: '1976'
        sources: [ giesbrecht-itapira ]
      - status: closed
        from: '1986'
        circa: true
        sources: [ giesbrecht-itapira ]
