name: Estrada de Ferro Sorocabana
short: Sorocabana
color: '#12808a'
gauge_mm: 1000
network: sorocabana
summary: >-
  Nasceu para ligar Sorocaba a São Paulo (1875) e subiu o vale do Tietê até Botucatu (1889). Pelo
  ramal que partia de Capão Bonito (Rubião Júnior), chegou a Bauru em 1905, um ano antes de a
  Noroeste começar dali. Nesta etapa, o tronco até Rubião Júnior e o Ramal de Bauru.
