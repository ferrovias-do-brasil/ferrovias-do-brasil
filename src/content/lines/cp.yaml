summary: >-
  A companhia formada por fazendeiros de café para levar os trilhos de Jundiaí ao interior. Começou
  em 1872 com Jundiaí–Campinas, em bitola larga, e chegou a Rio Claro em 1876. Nesta primeira etapa,
  só a Linha Tronco até Rio Claro.
