name: Companhia Paulista de Estradas de Ferro
short: Paulista
color: '#2f7d52'
gauge_mm: 1600
network: cp
summary: >-
  A companhia formada por fazendeiros de café para levar os trilhos de Jundiaí ao interior. Começou
  em 1872 com Jundiaí–Campinas, em bitola larga, chegou a Rio Claro em 1876 e, com as linhas da
  Companhia Rio-Clarense compradas em 1892, a Bauru em 1910, onde encontra a Noroeste.
