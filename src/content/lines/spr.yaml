summary: >-
  A primeira ferrovia paulista e a porta do café para o mar: de Santos, vencendo a Serra do Mar por
  planos inclinados com cabos, a São Paulo e Jundiaí, aberta em 16/2/1867 por uma companhia inglesa.
  Em Jundiaí começa a Paulista.
